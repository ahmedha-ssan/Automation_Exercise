name: E2E Regression Pipeline

# Events that trigger the workflow
on:
  push:
    branches: [ main ]

  pull_request:
    branches:
      - main
  # Runs daily at 06:00 UTC
  # Egypt: 08:00 in winter (UTC+2), 09:00 in summer (UTC+3)
  schedule:
    - cron: '00 6 * * *'

  workflow_dispatch:

env:
  TARGET: "com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:
  # ==========================================
  # Chrome - Linux
  # ==========================================
    Chrome_Linux_Test:
      runs-on: ubuntu-latest

      permissions:
        checks: write

      steps:
        - name: Checkout Repository # downloads the repository under $GITHUB_WORKSPACE GitHub repository's code
          uses: actions/checkout@v7

        - name: set up java
          uses: actions/setup-java@v6
          with: #passes configuration parameters
              distribution: 'zulu'
              java-version: '21'

        - name: set up maven
          uses: stCarolas/setup-maven@v5
          with:
              maven-version: 3.9.9

        - name: Running Tests
          continue-on-error: true
          run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -Dextensions="disabled" -DbrowserType="Chrome" clean test

        - name: Upload Test Results
          uses: actions/upload-artifact@v7
          with:
              name: Chrome_Linux_Report
              path: "test-output/reports/*.html"
  # ==========================================
  # Edge - Windows
  # ==========================================
    Edge_Windows_Test:
      runs-on: windows-latest
      permissions:
        checks: write

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: set up java
          uses: actions/setup-java@v6
          with:
            distribution: 'zulu'
            java-version: '21'

        - name: setup maven
          uses: stCarolas/setup-maven@v5
          with:
            maven-version: 3.9.9

        - name: Running Tests
          continue-on-error: true
          run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -Dextensions="enabled" -DbrowserType="Edge" clean test

        - name: Upload Test Results
          uses: actions/upload-artifact@v7
          with:
            name: Edge_Windows_Report
            path: "test-output/reports/*.html"

