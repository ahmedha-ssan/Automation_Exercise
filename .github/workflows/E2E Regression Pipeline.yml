name: E2E Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '00 21 * * *'
  workflow_dispatch:

env:
  TARGET: "%regex[.*Tests.*],com.automationexercices.tests.**.**,com.automationexercices.tests.**"

jobs:
    Chrome_Linux_Test:
      runs-on: ubuntu-latest
      permissions:
        checks: write
      steps:
        - name: checkout Code
          uses: actions/checkout@v7

        - name: setup java
          uses: actions/setup-java@v6
          with:
              distribution: 'zulu' # See 'Supported distributions' for available options
              java-version: '21'

        - name: setup maven
          uses: stCarolas/setup-maven@v5
          with:
              maven-version: 3.9.9
    - name: Running Tests
      run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -Dextensions="disabled" -DbrowserType="Chrome" clean test
      # remove continue-on-error temporarily so you see the real failure

    - name: Debug output folders
      if: always()
      run: |
        echo "---- test-output ----"
        ls -R test-output || echo "test-output not found"
        echo "---- surefire ----"
        ls -R target/surefire-reports || echo "no surefire reports"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Chrome_Linux_Report
        path: |
          test-output/**
          target/surefire-reports/**
        if-no-files-found: error

    Edge_Windows_Test:
      runs-on: windows-latest
      permissions:
        checks: write
      steps:
        - name: checkout Code
          uses: actions/checkout@v7

        - name: setup java
          uses: actions/setup-java@v6
          with:
            distribution: 'zulu' # See 'Supported distributions' for available options
            java-version: '21'

        - name: setup maven
          uses: stCarolas/setup-maven@v5
          with:
            maven-version: 3.9.9

        - name: Running Tests
          run: mvn -Dtest="${TARGET}" -DexecutionType="LocalHeadless" -Dextensions="disabled" -DbrowserType="Chrome" clean test
          # remove continue-on-error temporarily so you see the real failure

        - name: Debug output folders
          if: always()
          run: |
            echo "---- test-output ----"
            ls -R test-output || echo "test-output not found"
            echo "---- surefire ----"
            ls -R target/surefire-reports || echo "no surefire reports"

        - name: Upload Test Results
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: Chrome_Linux_Report
            path: |
              test-output/**
              target/surefire-reports/**
            if-no-files-found: error